name: .NET Build and Test

on:
  push: # Run on pushes to any branch
  pull_request:
    branches: [main] # Any PR targeting main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore src/Bison.razor/Bison.Razor.csproj
    - name: Build
      run: dotnet build src/Bison.razor/Bison.Razor.csproj --no-restore
    - name: Test
      run: dotnet test src/Bison.razor/Bison.Razor.csproj --no-build --verbosity normal
      
