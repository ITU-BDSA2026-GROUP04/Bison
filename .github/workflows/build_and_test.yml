name: .NET Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Setup Dafny
      uses: dafny-lang/setup-dafny-action@v1
      with:
        dafny-version: '4.4.0'
    - name: Verify Dafny
      run: dafny verify src/Bison.razor/Filter/FilterWrapper.dfy
    - name: Restore dependencies
      run: dotnet restore src/Bison.razor/Bison.Razor.csproj
    - name: Build
      run: dotnet build src/Bison.razor/Bison.Razor.csproj --no-restore
    - name: Test
      run: dotnet test src/Bison.razor/Bison.Razor.csproj --no-build --verbosity normal
      
